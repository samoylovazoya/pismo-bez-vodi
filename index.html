function logI(id){

  var resp='',res='neutral',s=ST.done[id],i;
  if(t.type==='single')resp=(t.options[a.sel]||{}).t;

  else if(t.type==='order')resp=(a.order||[]).map(function(x){return x+1;}).join(',');
  else if(t.type==='cut')resp=(a.off||[]).map(function(v,k){return v?(k+1):'';}).filter(String).join(',');
  else if(t.type==='rewrite')resp=a.text||'';

/* ---------- проверка ---------- */
function checkTask(id){
  var t=TASKS[id],a=A(id),s=0,i;
  if(t.type==='multi'){
    var sel=a.sel||[],ok=0,hit=0,bad=0;
    t.options.forEach(function(o,k){if(o.ok)ok++;if(sel[k]&&o.ok)hit++;if(sel[k]&&!o.ok)bad++;});
    s=Math.max(0,(hit-bad)/ok);
  }else if(t.type==='order'){
    var c=0;a.order.forEach(function(ix,pos){if(ix===pos)c++;});s=c/a.order.length;
  }else if(t.type==='group'){
    var g=0;t.items.forEach(function(it,k){if(a.pick[k]===it.cat)g++;});s=g/t.items.length;
  }else if(t.type==='cut'){
    var r=0,off=a.off||[];t.items.forEach(function(it,k){if((!!off[k])===(!it.keep))r++;});s=r/t.items.length;
    if(keptWords(t,a)>t.limit)s=Math.min(s,0.8);
  }
  a.checked=true;ST.done[id]=s;redrawTask(id);
}

   +'<div class="field"><label for="f-email">Рабочая почта</label><input type="email" id="f-email" data-a="fin" data-k="email" autocomplete="email" placeholder="name@m-tech.am" value="'+esc(f.email||'')+'"></div></section>';
  h+='<section class="card"><div class="lab2" style="margin-bottom:10px">Шаг 1. Выберите сценарий</div><div class="scn">'+m.scenarios.map(function(x){
    return '<button data-a="sc" data-s="'+x.id+'" class="'+(f.sc===x.id?'on':'')+'"><b>'+esc(x.title)+'</b><span>'+esc(x.sub)+'. Адресат: '+esc(x.to)+'</span></button>';
  }).join('')+'</div></section>';
  if(!s)return h;
  h+='<section class="card"><div class="lab2" style="margin-bottom:8px">Ситуация и факты</div><p>'+esc(s.situation)+'</p><ul class="facts">'+s.facts.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul><p class="lab2" style="margin-top:10px">Используйте только эти цифры. ИИ проверит, не добавили ли вы лишнего.</p></section>';
  h+='<section class="card" style="display:flex;flex-direction:column;gap:16px"><div class="lab2">Шаг 2. План письма</div>'
   +'<div class="field"><label for="f-goal">Цель</label><span class="hint">Какое действие руководителя вам нужно? Один шаг и срок.</span><input type="text" id="f-goal" data-a="fin" data-k="goal" value="'+esc(f.goal||'')+'"></div>'
   +'<div class="field"><label>Три главные мысли</label><div class="three"><input type="text" id="f-i1" data-a="fin" data-k="i1" aria-label="Главная мысль 1" value="'+esc(f.i1||'')+'"><input type="text" id="f-i2" data-a="fin" data-k="i2" aria-label="Главная мысль 2" value="'+esc(f.i2||'')+'"><input type="text" id="f-i3" data-a="fin" data-k="i3" aria-label="Главная мысль 3" value="'+esc(f.i3||'')+'"></div></div>'
   +'<div class="field"><label for="f-tpl">Шаблон</label><select id="f-tpl" data-a="fin" data-k="tpl">'+['','Предложение / запрос','План — факт','Выводы — рекомендации','Свой: структура по вопросам руководителя'].map(function(o){return '<option value="'+esc(o)+'"'+((f.tpl||'')===o?' selected':'')+'>'+(o||'Выберите шаблон')+'</option>';}).join('')+'</select><span class="hint">Подсказка: для этого сценария подходит «'+esc(s.template)+'». Но решаете вы.</span></div>'
   +'<div class="lab2">Шаг 3. Письмо</div>'
   +'<div class="field"><label for="f-subj">Тема письма</label><input type="text" id="f-subj" data-a="fin" data-k="subj" value="'+esc(f.subj||'')+'"></div>'
   +'<div class="field"><label for="f-body">Текст письма</label><textarea id="f-body" data-a="fin" data-k="body" style="min-height:220px">'+esc(f.body||'')+'</textarea><span class="counter" id="f-wc">'+wc(f.body)+' слов, ориентир до 200</span></div>'
   +'<div class="actions"><button class="btn primary" data-a="gen" id="f-gen"'+(wc(f.body)>=20&&f.goal?'':' disabled')+'>Получить промпт для проверки</button></div></section>';
  if(f.prompt){
    h+='<section class="card" style="display:flex;flex-direction:column;gap:12px"><div class="lab2">Шаг 4. Проверка через ИИ</div><ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px"><li>Нажмите «Скопировать промпт». Промпт — это готовый текст-запрос для ИИ.</li><li>Откройте ИИ-чат, которым вы пользуетесь (например, Claude или ChatGPT), и начните новый диалог.</li><li>Вставьте промпт в строку сообщения и отправьте.</li><li>ИИ ответит оценкой по 8 критериям и тремя главными правками.</li><li>Исправьте письмо, отправьте новую версию в тот же диалог и введите итоговый балл в шаге 5.</li></ol>'
     +'<textarea id="f-prompt" class="promptbox" readonly aria-label="Промпт для проверки">'+esc(f.prompt)+'</textarea>'
     +'<p class="lab2">Не вставляйте в письмо и в ИИ реальные названия клиентов, цены контрактов и персональные данные. Используйте только факты сценария.</p>'
     +'<div class="actions"><button class="btn primary" data-a="copy">Скопировать промпт</button><button class="btn" data-a="gen">Обновить промпт по текущему тексту</button></div></section>';
    h+='<section class="card" style="display:flex;flex-direction:column;gap:14px"><div class="lab2">Шаг 5. Результат проверки</div>'
     +'<div class="field"><label for="f-score">Итоговый балл от ИИ (0–16)</label><span class="hint">Балл покажет ИИ в ответе. Он нужен, чтобы отправить результат.</span><input type="number" min="0" max="16" step="1" id="f-score" data-a="fin" data-k="score" value="'+esc(f.score===undefined?'':f.score)+'" style="max-width:140px"></div>'
     +'<div class="field"><label for="f-main">Главная правка, которую вы внесёте</label><input type="text" id="f-main" data-a="fin" data-k="main" value="'+esc(f.main||'')+'"></div>'
     +'<div id="f-msg">'+scoreMsg(f.score)+'</div></section>';
    h+='<section class="card" style="display:flex;flex-direction:column;gap:12px"><div class="lab2">Шаг 6. Отправьте результат</div>'
     +'<p style="max-width:68ch">Нажимая «Отправить», вы передаёте организатору курса имя, план, текст письма, балл от ИИ и главную правку. Не включайте в письмо реальные данные клиентов.</p>'
     +'<div class="actions"><button class="btn primary" data-a="send" id="f-send"'+(sendReady()?'':' disabled')+'>'+(f.sent?'Отправить ещё раз':'Отправить результат')+'</button></div>'
     +'<div id="f-sendmsg">'+sendMsg()+'</div></section>';
  }
  return h;
}

/* ---------- шпаргалка ---------- */
function cheatHtml(){
  return '<div class="modhead"><h2>Шпаргалка</h2><p class="lead">Всё, что нужно держать под рукой перед отправкой письма.</p></div><div class="cheat">'
   +'<section class="card"><h3>Алгоритм</h3><ol>'+CHEAT.algo.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol></section>'
   +'<section class="card"><h3>Три шаблона</h3><ul>'+CHEAT.templates.map(function(x){return '<li><b>'+esc(x[0])+'.</b> '+esc(x[1])+'</li>';}).join('')+'</ul><h3 style="margin-top:16px">Этапы вопроса</h3><p>'+CHEAT.stages.join(' → ')+'</p></section>'
   +'<section class="card"><h3>Проверка перед отправкой</h3><ul>'+CHEAT.checks.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></section></div>';
}

/* ---------- каркас ---------- */
function renderNav(){
  var h='<div class="grp">Модули</div>';
  MODS.forEach(function(m,i){
    var d=modDone(m);
    h+='<button class="mod'+(ST.cur===m.id?' active':'')+(d?' done':'')+'" data-a="go" data-m="'+m.id+'"><span class="n">'+(d?'✓':i)+'</span><span class="t">'+esc(m.title)+'<small>'+m.time+'</small></span></button>';
  });
  $('nav').innerHTML=h;
}
function renderMeter(){
  var req=MODS.filter(function(m){return !m.optional;}),n=req.filter(modDone).length;
  $('mtxt').textContent=n+' из '+req.length+' модулей';
  $('mbar').style.width=Math.round(n/req.length*100)+'%';
}
function afterChange(){
  renderNav();renderMeter();
  var m=modById(ST.cur);
  if(m&&!m.final){var el=$('after');if(el)el.innerHTML=afterHtml(m);}
}
function renderMain(){
  var main=$('main');
  var m=modById(ST.cur)||MODS[0];ST.cur=m.id;
  var h='<div class="modhead"><div class="chips"><span class="chip">'+m.time+'</span>'+(m.optional?'<span class="chip opt">по желанию</span>':'')+'</div><h2>'+esc(m.title)+'</h2><p class="lead">'+esc(m.lead)+'</p></div>';
  if(m.final){h+='<div id="final">'+finalHtml(m)+'</div><div id="after"></div>';}
  else{h+=(m.intro?'<section class="card rule">'+m.intro+'</section>':'')+m.tasks.map(renderTask).join('')+'<div id="after">'+afterHtml(m)+'</div>';}
  main.innerHTML=h+foot();
  renderNav();renderMeter();
  if(m.final){var af=$('after');if(af&&ST.done.final)af.innerHTML=afterHtml(m);}
}
function foot(){return '<p class="foot"><span id="lmslbl">'+esc(SC.label())+'</span><br>По мотивам книги Павла Безручко «Без воды. Как писать предложения и отчеты для первых лиц». Прогресс сохраняется в LMS: можно закрыть курс и вернуться позже.</p>';}
function go(id){ST.cur=id;save();renderMain();window.scrollTo(0,0);}
function toast(t){var d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove();},2200);}

/* ---------- события ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;
  var act=b.getAttribute('data-a'),id=b.getAttribute('data-t'),i=+b.getAttribute('data-i'),t=id?TASKS[id]:null,a=id?A(id):null;
  if(act==='go'){go(b.getAttribute('data-m'));return;}
  if(act==='single'&&!b.disabled){a.sel=i;ST.done[id]=t.options[i].ok?1:0;redrawTask(id);return;}
  if(act==='multi'&&!a.checked){a.sel=a.sel||[];a.sel[i]=!a.sel[i];redrawTask(id);return;}
  if(act==='check'){checkTask(id);return;}
  if(act==='retry'){ST.tries=ST.tries||{};ST.tries[id]=tries(id)+1;delete ST.ans[id];delete ST.done[id];delete t._ord;redrawTask(id);return;}
  if(act==='mv'){initOrder(t,a);var d=+b.getAttribute('data-d'),j=i+d;if(j>=0&&j<a.order.length){var x=a.order[i];a.order[i]=a.order[j];a.order[j]=x;}redrawTask(id);return;}
  if(act==='cat'&&!a.checked){a.pick=a.pick||[];a.pick[i]=+b.getAttribute('data-c');redrawTask(id);return;}
  if(act==='cut'&&!a.checked){a.off=a.off||[];a.off[i]=!a.off[i];redrawTask(id);return;}
  if(act==='show'){a.shown=true;a.checks=[];ST.done[id]=0;redrawTask(id);return;}
  if(act==='rchk'){a.checks=a.checks||[];a.checks[i]=b.checked;var c=0;a.checks.forEach(function(v){if(v)c++;});ST.done[id]=c/t.checks.length;save();
    var st=document.querySelector('#task-'+id+' .head');var pe=st.querySelector('.st');var np=pill(t);var tmp=document.createElement('div');tmp.innerHTML=np;if(pe)pe.replaceWith(tmp.firstChild);else st.appendChild(tmp.firstChild);afterChange();return;}
  if(act==='sc'){ST.fin.sc=b.getAttribute('data-s');save();$('final').innerHTML=finalHtml(modById('m6'));return;}
  if(act==='gen'){ST.fin.prompt=buildPrompt();save();$('final').innerHTML=finalHtml(modById('m6'));renderNav();renderMeter();var pr=$('f-prompt');if(pr)pr.scrollIntoView({behavior:'smooth',block:'center'});return;}
  if(act==='memocopy'){var tx=memoText();var ok=function(){toast('Памятка скопирована');};
    var fb2=function(){var ta2=document.createElement('textarea');ta2.value=tx;document.body.appendChild(ta2);ta2.select();try{document.execCommand('copy');ok();}catch(e3){toast('Не удалось скопировать');}ta2.remove();};
    try{navigator.clipboard.writeText(tx).then(ok,fb2);}catch(e4){fb2();}return;}
  if(act==='send'){doSend();return;}
  if(act==='copyans'){var tx2=JSON.stringify(payload(),null,2);var ok2=function(){toast('Ответ скопирован');};
    var fb3=function(){var t3=document.createElement('textarea');t3.value=tx2;document.body.appendChild(t3);t3.select();try{document.execCommand('copy');ok2();}catch(e5){toast('Не удалось скопировать');}t3.remove();};
    try{navigator.clipboard.writeText(tx2).then(ok2,fb3);}catch(e6){fb3();}return;}
  if(act==='copy'){var ta=$('f-prompt');var done=function(){toast('Промпт скопирован');};
    var fb=function(){ta.focus();ta.select();try{if(document.execCommand('copy')){done();return;}}catch(er){}toast('Текст выделен, нажмите Ctrl+C');};
    try{navigator.clipboard.writeText(ta.value).then(done,fb);}catch(er2){fb();}return;}
});
document.addEventListener('input',function(e){
  var el=e.target,act=el.getAttribute&&el.getAttribute('data-a');if(!act)return;
  if(act==='text'){var id=el.getAttribute('data-t');A(id).text=el.value;save();
    var btn=document.querySelector('#task-'+id+' [data-a="show"]');if(btn)btn.disabled=!(wc(el.value)>=minW(TASKS[id]));
    var c=el.parentNode.querySelector('.counter');if(c)c.textContent=wc(el.value)+' сл. Нужно от '+minW(TASKS[id])+', чтобы открыть образец';}
  else if(act==='note'){ST.notes[el.getAttribute('data-m')]=el.value;save();}
  else if(act==='fin'){ST.fin[el.getAttribute('data-k')]=el.value;save();
    if(el.getAttribute('data-k')==='body'){var w=$('f-wc');if(w)w.textContent=wc(el.value)+' слов, ориентир до 200';}
    var g=$('f-gen');if(g)g.disabled=!(wc(ST.fin.body)>=20&&ST.fin.goal);
    if(el.getAttribute('data-k')==='score'){var fm=$('f-msg');if(fm)fm.innerHTML=scoreMsg(el.value);}
    var sb=$('f-send');if(sb)sb.disabled=!sendReady();}
});
document.addEventListener('change',function(e){
  var el=e.target;if(el.getAttribute&&el.getAttribute('data-k')==='score'&&scoreOk(el.value)){SC.interaction('final_ai_score',el.value+' из 16','neutral');}if(el.getAttribute&&el.getAttribute('data-a')==='fin'&&el.tagName==='SELECT'){ST.fin.tpl=el.value;save();}
});
SC.start();
if(BUILD==='sco2'){document.documentElement.className+=' solo';}
load();restorePrompt();
if(!isPage(ST.cur))ST.cur=MODS[0].id;
renderMain();
})();

</script></body></html>
